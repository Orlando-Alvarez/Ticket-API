services:
  api:
    build: !reset null
    image: "${TICKET_API_IMAGE:?TICKET_API_IMAGE is required}"
    pull_policy: never
    environment:
      APP_DEBUG: "false"

  migrate:
    build: !reset null
    image: "${TICKET_API_IMAGE:?TICKET_API_IMAGE is required}"
    pull_policy: never

  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
      - "443:443"

    volumes: !override
      - ./nginx/aws-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro