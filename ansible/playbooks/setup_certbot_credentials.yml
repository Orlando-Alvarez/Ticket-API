
---
- name: Configure Certbot Cloudflare credentials
  hosts: ticket_api
  become: true
  gather_facts: false

  vars:
    deploy_dir: /opt/ticket-api

  tasks:
    - name: Create protected credentials directory
      ansible.builtin.file:
        path: /etc/ticket-api
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install Certbot credentials synchronization script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/sync_certbot_credentials.py"
        dest: "{{ deploy_dir }}/sync_certbot_credentials.py"
        owner: root
        group: root
        mode: "0700"

    - name: Synchronize Certbot credentials from SSM
      ansible.builtin.command:
        argv:
          - "{{ deploy_dir }}/.venv-secrets/bin/python"
          - "{{ deploy_dir }}/sync_certbot_credentials.py"
      register: credential_sync
      changed_when: "'UPDATED:' in credential_sync.stdout"
      no_log: true

    - name: Check credentials file permissions
      ansible.builtin.stat:
        path: /etc/ticket-api/cloudflare-certbot.ini
      register: credential_file

    - name: Require protected credentials
      ansible.builtin.assert:
        that:
          - credential_file.stat.exists
          - credential_file.stat.mode == "0600"
        fail_msg: "Certbot credentials are missing or insecure"
