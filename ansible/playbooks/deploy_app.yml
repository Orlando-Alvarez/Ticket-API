
---
- import_playbook: pull_ecr_image.yml

- name: Deploy Ticket-API to AWS EC2
  hosts: ticket_api
  become: true
  gather_facts: false

  vars:
    deploy_dir: "/opt/ticket-api"
    ecr_registry: "891920435362.dkr.ecr.us-west-2.amazonaws.com"
    ticket_api_image: "{{ ecr_registry }}/ticket-api@{{ image_digest }}"

    compose_files:
      - docker-compose.yml
      - compose.prod.yaml
      - compose.aws.yaml

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Nginx configuration directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}/nginx"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy deployment configuration files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "{{ deploy_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - docker-compose.yml
        - compose.prod.yaml
        - compose.aws.yaml
        - nginx/default.conf

    - name: Ensure Python virtual environment for secrets
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ deploy_dir }}/.venv-secrets"
        creates: "{{ deploy_dir }}/.venv-secrets/bin/python"

    - name: Ensure Boto3 is installed
      ansible.builtin.pip:
        name: boto3
        virtualenv: "{{ deploy_dir }}/.venv-secrets"

    - name: Copy secret synchronization script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/sync_ssm_secrets.py"
        dest: "{{ deploy_dir }}/sync_ssm_secrets.py"
        owner: root
        group: root
        mode: "0700"

    - name: Synchronize secrets from Parameter Store
      ansible.builtin.command:
        argv:
          - "{{ deploy_dir }}/.venv-secrets/bin/python"
          - "{{ deploy_dir }}/sync_ssm_secrets.py"
      register: secrets_sync
      changed_when: "'CREATED:' in secrets_sync.stdout"
      no_log: true

    - name: Enforce environment file permissions
      ansible.builtin.file:
        path: "{{ deploy_dir }}/.env"
        state: file
        owner: root
        group: root
        mode: "0600"

    - name: Validate combined Docker Compose configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - docker-compose.yml
          - -f
          - compose.prod.yaml
          - -f
          - compose.aws.yaml
          - config
          - --quiet
        chdir: "{{ deploy_dir }}"
      environment:
        TICKET_API_IMAGE: "{{ ticket_api_image }}"
      changed_when: false
      no_log: true

    - name: Start Ticket-API application stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        project_name: ticket-api
        files: "{{ compose_files }}"
        state: present
        build: never
        pull: policy
        recreate: auto
      environment:
        TICKET_API_IMAGE: "{{ ticket_api_image }}"
      register: deployment_result
    

    - name: Show Docker Compose actions
      ansible.builtin.debug:
        var: deployment_result.actions

    - name: Verify API database readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/v1/health/ready"
        method: GET
        status_code: 200
        timeout: 5
      register: api_readiness
      retries: 15
      delay: 5
      until: api_readiness.status == 200
      changed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        msg:
          - "Ticket-API deployment completed."
          - "Compose changed: {{ deployment_result.changed }}"
          - "Readiness endpoint returned HTTP {{ api_readiness.status }}"
