name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: "ci-test-key-only-not-for-production-123456789"
      DATABASE_URL: "postgresql+psycopg://ci_placeholder:ci_placeholder@127.0.0.1:65432/ci_unit_placeholder"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Ruff
        run: python -m ruff check app tests ansible/files/cloudflare_ddns.py

      - name: Run tests
        run: python -m pytest --ignore=tests/integration

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ticket_test:test_only_password@127.0.0.1:5432/ticket_api_test
      JWT_SECRET_KEY: "ci-only-jwt-secret-for-testing-123456789"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: ticket_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test -d ticket_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/integration -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, postgres]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Ticket-API image
        run: docker build -t ticket-api:ci .

  publish-ecr:
    name: Publish Docker image to Amazon ECR
    runs-on: ubuntu-latest
    needs: [docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: ticket-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::891920435362:role/ticket-api-dev-github-ecr-publisher
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"
