name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: "ci-test-key-only-not-for-production-123456789"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ticket_test:test_only_password@127.0.0.1:5432/ticket_api_test
      JWT_SECRET_KEY: "ci-only-jwt-secret-for-testing-123456789"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: ticket_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test -d ticket_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/integration -v
