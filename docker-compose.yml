services:
  api:
    build:
      context: .
    restart: unless-stopped
    container_name: ticket-api
    environment:
      APP_DEBUG: "${APP_DEBUG:-false}"
      DATABASE_URL: &database_url "postgresql+psycopg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:?required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy_net
      - data_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: ticket-api-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_net

  migrate:
    build:
      context: .
    environment:
      DATABASE_URL: *database_url
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - data_net
  nginx:
    image: nginx:stable-alpine
    container_name: ticket-api-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy

    networks:
      - proxy_net
volumes:
  postgres_data:

networks:
  proxy_net:
    driver: bridge

  data_net:
    driver: bridge