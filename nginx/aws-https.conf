
map $uri $rate_limit_key {
    default $binary_remote_addr;

    =/api/v1/health "";
    =/api/v1/health/ready "";
}

limit_req_zone $rate_limit_key zone=api_limit:10m rate=10r/s;

log_format ticket_api
    'ip=$remote_addr '
    'method=$request_method '
    'path=$uri '
    'status=$status '
    'request_time=$request_time '
    'upstream_time=$upstream_response_time '
    'upstream_status=$upstream_status';

server {
    listen 80;
    server_name _;

    location = /api/v1/health/ready {
        proxy_pass http://api:8000;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name api.orlandoalvarez.dev;

    ssl_certificate /etc/letsencrypt/live/api.orlandoalvarez.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orlandoalvarez.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /dev/stdout ticket_api;
    error_log /dev/stderr warn;

    limit_req_status 429;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
